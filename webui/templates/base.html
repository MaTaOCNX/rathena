<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}{{ server_name }}{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="{{ url_for('shop') }}">{{ server_name }}</a>
    {% if user %}
    <nav>
      <a href="{{ url_for('shop') }}" class="{{ 'active' if request.endpoint == 'shop' }}">Cash shop</a>
      <a href="{{ url_for('cash') }}" class="{{ 'active' if request.endpoint == 'cash' }}">Cash points</a>
      <form method="post" action="{{ url_for('logout') }}" class="inline">
        <input type="hidden" name="csrf" value="{{ csrf_token() }}">
        <button type="submit" class="link">Log out <span class="muted">({{ user }})</span></button>
      </form>
    </nav>
    {% endif %}
  </header>
  <main>
    {% with messages = get_flashed_messages(with_categories=true) %}
      {% for category, message in messages %}
      <div class="flash {{ category }}">{{ message }}</div>
      {% endfor %}
    {% endwith %}
    {% block content %}{% endblock %}
  </main>
</body>
</html>
